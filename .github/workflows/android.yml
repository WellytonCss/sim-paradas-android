name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar o app
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Nomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk "SIM-Paradas-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-Paradas-1.0.${{ github.run_number }}
          path: SIM-Paradas-*.apk
      - name: Publicar versão (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SIM Paradas 1.0.${{ github.run_number }}
          body: APK do app SIM Paradas (Android). Baixe o arquivo .apk abaixo e instale no celular.
          files: SIM-Paradas-*.apk
